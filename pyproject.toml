[project]
name = "supply-chain-intelligence"
version = "0.1.0"
description = "Multi-echelon demand forecasting and inventory optimization over retail SKU-store series."
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Week-1 core: ingestion, warehouse, SQL analytics. Kept deliberately small so
# `uv sync` is fast. Modelling and serving deps live in the extras below.
dependencies = [
    "duckdb>=1.1",
    "polars>=1.9",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.9",
]

[project.optional-dependencies]
models = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "scipy>=1.14",
    "statsforecast>=1.7",
    "mlforecast>=0.13",
    "hierarchicalforecast>=0.4",
    "utilsforecast>=0.2",
]
optimize = [
    "pulp>=2.9",
]
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.39",
    "plotly>=5.24",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "jupyterlab>=4.2",
]

[project.scripts]
sci = "sci.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sci", "ingest", "features", "models", "optimize", "evaluation", "app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
